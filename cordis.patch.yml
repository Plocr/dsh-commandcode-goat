# dsh-commandcode-goat — the loader row this bundle contributes.
#
# A patch file is a top-level YAML ARRAY of patch entries, and a patch replaces
# the targeted row's whole `config` (it does not deep-merge), so this bundle
# only ever *adds* its own row and never restates a shipped one. The row names
# this package rather than a source path, which is what lets Node resolve the
# installed code.
#
# The plugin hard-injects nothing: `settings`, `web`, `webServer`, `tools` and
# `credentials` are each attached through an optional ctx.inject, so the same
# row loads in a headless or SDK profile and simply does less there.
#
# Per-deployment facts belong here rather than in the settings card when they
# are secrets or fixed by the deployment. Anything omitted falls back to the
# schema defaults:
#
#   config:
#     plan: goat            # go | goat | pro | max
#     targetApiKeyEnv: COMMANDCODE_API_KEY
#     # targetBaseURL: https://api.commandcode.ai/provider/v1
#     # usageBaseURL: https://api.commandcode.ai
#     # extraIds: [my/private-model]
#     # autoSync: false      # on by default: the routes are created on first load
#     # pruneOtherPlans: false  # on by default: a switch removes the other tier's routes
#     # webSearch: true
#     # recoverUpstreamOverflow: false  # on by default: reduce + retry once the gateway refuses
#     # maxContextWindow: 0  # 0 keeps the vendor's own window on every model
#
# `recoverUpstreamOverflow` is what handles a gateway that refuses a request it
# cannot expand — the "path expansion / 512 candidates" 400 the harness reads as
# an ordinary invalid request, and therefore neither retries nor compacts for.
# With it on, this plugin prunes oversized tool results and asks for the request
# to be retried, and compacts one region on a second refusal, so the routes can
# keep publishing the window the vendor declares. Turn it off to let the
# upstream error stand as it is.
#
# `maxContextWindow` is the escape hatch, and it is not a fix: a vendor number
# the gateway cannot honour does not buy a longer conversation, it buys a
# rejected request once the conversation passes what the route really accepts.
# Lowering it makes the harness summarise earlier and permanently — the
# subscription's own window stops being usable at all — so it is only for a
# deployment whose gateway refuses even reduced requests.

- insert:
    - id: commandcode-goat
      name: dsh-commandcode-goat
